name: Build & push image

on:
  push:
    branches: [version2/plan]
  workflow_dispatch: # lets you also trigger it manually from the Actions tab

env:
  IMAGE: ghcr.io/carlovinci17/recipe-planner

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # ← this is what lets it push to ghcr.io (no PAT needed)
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # auto-provided by GitHub

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
